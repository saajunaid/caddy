<style>
/* Layout: app shell. Phone = sticky top bar + fixed bottom nav. Desktop (>=1024px) = left sidebar + content column.
   Dark-first: Dracula on bare :root, Alucard (Dracula light) under prefers-color-scheme: light / data-theme="light". */
:root {
  --bg: #282A36;
  --surface: #2E303E;
  --sunk: #21222C;
  --line: #44475A;
  --fg: #F8F8F2;
  --muted: #9AA5CE;
  --purple: #BD93F9;
  --green: #50FA7B;
  --orange: #FFB86C;
  --red: #FF5555;
  --cyan: #8BE9FD;
  --yellow: #F1FA8C;
  --pink: #FF79C6;
  --on-accent: #21222C;
  --shadow: 0 1px 0 rgba(0,0,0,.25);
  --font-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
  --nav-h: 64px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #FAF7F2; --surface: #FFFFFF; --sunk: #F1ECE5; --line: #E3DBD1; --fg: #1F1F1F; --muted: #6B6159;
    --purple: #644AC9; --green: #14710A; --orange: #A34D14; --red: #CB3A2A; --cyan: #036A96; --yellow: #846E15; --pink: #A3144D;
    --on-accent: #FFFFFF; --shadow: 0 1px 2px rgba(60,50,20,.08);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #FAF7F2; --surface: #FFFFFF; --sunk: #F1ECE5; --line: #E3DBD1; --fg: #1F1F1F; --muted: #6B6159;
  --purple: #644AC9; --green: #14710A; --orange: #A34D14; --red: #CB3A2A; --cyan: #036A96; --yellow: #846E15; --pink: #A3144D;
  --on-accent: #FFFFFF; --shadow: 0 1px 2px rgba(60,50,20,.08);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #282A36; --surface: #2E303E; --sunk: #21222C; --line: #44475A; --fg: #F8F8F2; --muted: #9AA5CE;
  --purple: #BD93F9; --green: #50FA7B; --orange: #FFB86C; --red: #FF5555; --cyan: #8BE9FD; --yellow: #F1FA8C; --pink: #FF79C6;
  --on-accent: #21222C; --shadow: 0 1px 0 rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sunk); }
a { color: var(--cyan); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 1.05rem; font-weight: 600; }
h3 { font-size: .95rem; font-weight: 600; }
p { margin: 0; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num { font-size: .92em; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.label { font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: 1fr; min-height: 100%; }
.sidebar { display: none; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; gap: 10px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--sunk); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.05rem; }
.brand-mark { width: 26px; height: 26px; border-radius: 8px; background: var(--purple); color: var(--on-accent); display: grid; place-items: center; font-family: var(--font-mono); font-size: .85rem; font-weight: 600; }
.topbar .spacer { flex: 1; }
.icon-btn { position: relative; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; border: 1px solid transparent; background: transparent; cursor: pointer; color: var(--fg); }
.icon-btn:hover { background: var(--surface); border-color: var(--line); }
.icon-btn .dot { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--pink); }
.sample-pill { font-size: .7rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--yellow); border: 1px solid color-mix(in srgb, var(--yellow) 45%, transparent); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }

main { min-width: 0; padding-block: 20px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 1120px; margin: 0 auto; display: grid; gap: 22px; }
.page > *, .grid-2 > *, .stack > *, .trips > * { min-width: 0; }

.bottomnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  background: var(--sunk); border-top: 1px solid var(--line);
}
.bottomnav button { height: var(--nav-h); display: grid; place-items: center; align-content: center; gap: 2px; background: none; border: 0; color: var(--muted); font-size: .72rem; font-weight: 500; cursor: pointer; }
.bottomnav button[aria-current="page"] { color: var(--purple); }
.bottomnav svg { width: 22px; height: 22px; }

@media (min-width: 1024px) {
  .app { grid-template-columns: 236px 1fr; }
  .topbar, .bottomnav { display: none; }
  .sidebar {
    display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
    padding: 18px 12px; padding-left: max(12px, env(safe-area-inset-left, 0px)); background: var(--sunk); border-right: 1px solid var(--line);
  }
  .sidebar .brand { padding: 4px 8px 16px; }
  .sidebar .group { margin: 14px 8px 4px; }
  .navlink { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--fg); background: none; border: 0; cursor: pointer; text-align: left; font-weight: 500; }
  .navlink svg { width: 18px; height: 18px; color: var(--muted); }
  .navlink:hover { background: var(--surface); }
  .navlink[aria-current="page"] { background: color-mix(in srgb, var(--purple) 18%, transparent); color: var(--fg); }
  .navlink[aria-current="page"] svg { color: var(--purple); }
  .navlink .count { margin-left: auto; font-family: var(--font-mono); font-size: .75rem; color: var(--muted); }
  .sidebar .foot { margin-top: auto; padding: 12px 8px 0; display: grid; gap: 8px; }
  main { padding-block: 28px 48px; padding-left: 36px; padding-right: max(36px, env(safe-area-inset-right, 0px)); }
}

/* ---------- Building blocks ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.pad { padding: 16px; }
.stack { display: grid; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grid-2 { display: grid; gap: 22px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .grid-2 { grid-template-columns: 1.35fr 1fr; } }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.section-head a, .linkbtn { font-size: .85rem; background: none; border: 0; color: var(--cyan); cursor: pointer; padding: 0; }

.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; --c: var(--muted); color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent); }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.chip.plain::before { display: none; }
.c-green { --c: var(--green); } .c-orange { --c: var(--orange); } .c-red { --c: var(--red); } .c-yellow { --c: var(--yellow); }
.c-cyan { --c: var(--cyan); } .c-purple { --c: var(--purple); } .c-pink { --c: var(--pink); } .c-muted { --c: var(--muted); }

.tag { font-family: var(--font-mono); font-size: .68rem; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.official { color: var(--cyan); border-color: color-mix(in srgb, var(--cyan) 40%, transparent); }
.tag.you { color: var(--pink); border-color: color-mix(in srgb, var(--pink) 40%, transparent); }
.tag.estimate, .tag.proposed { color: var(--yellow); border-color: color-mix(in srgb, var(--yellow) 40%, transparent); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: .88rem; color: var(--fg); }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--purple); border-color: var(--purple); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn svg { width: 16px; height: 16px; }

.list { display: grid; }
.list > * + * { border-top: 1px solid var(--line); }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-width: 0; }
.item .grow { flex: 1; min-width: 0; }
.item .title { font-weight: 600; }
.item.clickable { cursor: pointer; }
.item.clickable:hover { background: color-mix(in srgb, var(--fg) 4%, transparent); }
.stripe { width: 4px; align-self: stretch; border-radius: 4px; background: var(--c, var(--line)); flex: none; }

.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.filter { flex: none; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: .85rem; font-weight: 500; color: var(--fg); }
.filter[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.filter .n { font-family: var(--font-mono); font-size: .75rem; opacity: .7; margin-left: 4px; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tab { flex: none; padding: 10px 12px; background: none; border: 0; border-bottom: 2px solid transparent; cursor: pointer; font-weight: 600; color: var(--muted); }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--purple); }

.health { display: flex; gap: 8px; flex-wrap: wrap; }
.health .h { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; background: var(--sunk); border: 1px solid var(--line); font-size: .78rem; }
.fresh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th { text-align: left; font-size: .72rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover td { background: color-mix(in srgb, var(--fg) 4%, transparent); }
td.r, th.r { text-align: right; }

.only-desk { display: none; }
@media (min-width: 1024px) { .only-desk { display: block; } .only-phone { display: none; } }

.kv { display: grid; grid-template-columns: minmax(120px, 40%) 1fr; gap: 8px 14px; font-size: .9rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; }

.note { font-size: .82rem; color: var(--muted); padding: 10px 12px; border-left: 3px solid var(--line); background: var(--sunk); border-radius: 0 8px 8px 0; }

.field { display: grid; gap: 6px; }
.field label { font-size: .82rem; font-weight: 600; }
.input, select.input, textarea.input { width: 100%; min-height: 40px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }
textarea.input { min-height: 72px; resize: vertical; }

.listing-card { display: grid; gap: 10px; padding: 14px 16px; cursor: pointer; }
.listing-card:hover { border-color: var(--muted); }
.price { font-family: var(--font-mono); font-weight: 600; font-variant-numeric: tabular-nums; }

/* Map */
.map { position: relative; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: var(--sunk); }
.map svg { display: block; width: 100%; height: auto; max-width: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.cat { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: .8rem; font-weight: 500; color: var(--fg); }
.cat i { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-family: var(--font-mono); font-size: .65rem; font-weight: 600; color: var(--on-accent); background: var(--c); }
.cat[aria-pressed="false"] { opacity: .45; }
.cat[aria-pressed="false"] i { background: var(--muted); }

/* Bill review */
.bill-paper { background: #FFFFFF; color: #1F1F1F; border-radius: 8px; padding: 18px; font-size: .78rem; line-height: 1.45; border: 1px solid var(--line); }
.bill-paper .hl { background: rgba(241,250,140,.55); border-radius: 3px; padding: 0 2px; }
.bill-paper .hdr { display: flex; justify-content: space-between; border-bottom: 2px solid #1F1F1F; padding-bottom: 8px; margin-bottom: 10px; font-weight: 700; }
.bill-paper table { font-size: .76rem; }
.bill-paper td, .bill-paper th { padding: 4px 4px; border-color: #ddd; color: #1F1F1F; }
.conf { display: inline-flex; gap: 2px; }
.conf b { width: 5px; height: 12px; border-radius: 2px; background: var(--line); }
.conf.hi b { background: var(--green); } .conf.md b:nth-child(-n+2) { background: var(--yellow); } .conf.lo b:first-child { background: var(--red); }
.fieldrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 16px; }
.fieldrow .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.fieldrow.confirmed .v::after { content: "  ✓"; color: var(--green); }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 10px 16px; cursor: pointer; }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--purple); }

/* Calc */
.calc { display: grid; gap: 0; font-size: .9rem; }
.calc .ln { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 9px 16px; border-top: 1px solid var(--line); }
.calc .ln:first-child { border-top: 0; }
.calc .ln.total { font-weight: 700; background: color-mix(in srgb, var(--green) 10%, transparent); }
.calc .ln .op { color: var(--muted); font-size: .82rem; }

.countdown { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 12px; background: var(--sunk); border: 1px solid var(--line); flex: none; }
.countdown b { font-family: var(--font-mono); font-size: 1.35rem; line-height: 1; }
.countdown span { font-size: .65rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

/* Week */
.week { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 1024px) { .week { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; } }
.day { display: grid; gap: 6px; align-content: start; padding: 10px; min-height: 0; }
@media (min-width: 1024px) { .day { min-height: 220px; } }
.day.today { border-color: var(--purple); }
.day .dh { display: flex; justify-content: space-between; align-items: baseline; font-size: .8rem; }
.ev { font-size: .8rem; padding: 6px 8px; border-radius: 6px; background: var(--sunk); border-left: 3px solid var(--c, var(--line)); min-width: 0; overflow-wrap: anywhere; }
.ev .t { font-family: var(--font-mono); font-size: .72rem; color: var(--muted); }
.avatar { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: .65rem; font-weight: 700; background: var(--sunk); border: 1px solid var(--line); flex: none; }

/* Trips */
.trips { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .trips { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.trip { display: grid; gap: 12px; padding: 16px; align-content: start; }
.trip .big { font-family: var(--font-mono); font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.comp { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: .84rem; padding: 7px 0; border-top: 1px dashed var(--line); }
.rank { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: .88rem; z-index: 20; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: calc(100% - 32px); }
@media (min-width: 1024px) { .toast { bottom: 24px; } }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { padding: 7px 12px; background: transparent; border: 0; cursor: pointer; font-weight: 600; font-size: .85rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--purple); color: var(--on-accent); }

.switch { width: 40px; height: 24px; border-radius: 999px; background: var(--line); border: 0; position: relative; cursor: pointer; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--fg); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--green); }
.switch[aria-checked="true"]::after { transform: translateX(16px); background: var(--on-accent); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

      { dest: "Albufeira, Algarve", sub: "Half board · family room · 6 nights", comps: [["Flights DUB–FAO", "Ryanair · 4 pax · 2×20kg bags", 612], ["Hotel", "Family room · half board", 1764], ["Transfers", "Return shuttle", 96], ["Tourist tax", "€2 per adult per night", 24, true]], note: "Cheapest. Hotel is 3★ and 1.2 km from beach.", miss: "Excludes lunches" },
      { dest: "Puerto de la Cruz, Tenerife", sub: "Self-catering apartment · 7 nights", comps: [["Flights DUB–TFS", "Aer Lingus · 4 pax · 2×20kg bags", 1036], ["Apartment", "2 bed · free cancellation", 980], ["Car hire", "7 days · 2 child seats", 315], ["Groceries", "Self-catering estimate", 350, true]], note: "Most flexible. Free cancellation until 1 Feb.", miss: "Excludes fuel, parking" },
      { dest: "Lara, Antalya", sub: "All inclusive · family suite · 6 nights", comps: [["Flights DUB–AYT", "SunExpress · 4 pax · bags incl.", 1180], ["Hotel", "All inclusive · 5★", 1690], ["Transfers", "₺2,150 → € at ECB 17 Oct", 60.12]], note: "All meals included, so fewer extras. Flight is 4h 50m.", miss: "Entry: check passport validity rules" }
    ];
    trips.forEach((t) => { t.total = t.comps.reduce((s, c) => s + c[2], 0); });
    trips.sort((a, b) => a.total - b.total);
    return [
      '<div class="row between"><div><div class="label">Trip brief</div><h1>Mid-term Feb 2027</h1><div class="muted">2 adults + 2 children (8 and 4 at travel) · from Dublin · 14–22 Feb · up to €3,200</div></div><button class="btn primary" data-toast="Add an option you found">' + ic("plus") + "Add option</button></div>",
      '<div class="row"><a class="btn" href="https://www.skyscanner.ie/" target="_blank" rel="noopener">Skyscanner ' + ic("ext", 12) + '</a><a class="btn" href="https://www.google.com/travel/flights" target="_blank" rel="noopener">Google Flights ' + ic("ext", 12) + '</a><a class="btn" href="https://www.booking.com/" target="_blank" rel="noopener">Booking.com ' + ic("ext", 12) + "</a></div>",
      '<div class="note">Prices here are options you entered, with the date you checked them. Caddy does not search live prices and never books anything.</div>',
      '<div class="trips">' + trips.map((t, i) => '<article class="card trip"><div class="row between"><span class="rank">#' + (i + 1) + ' by total cost</span><span class="small muted">checked 12 Oct</span></div><div><h2>' + t.dest + '</h2><div class="small muted">' + t.sub + '</div></div><div><div class="big">' + money(t.total, true) + '</div><div class="small muted">' + money(t.total / 4, true) + ' per person · ' + (t.total <= 3200 ? '<span style="color:var(--green)">within budget</span>' : '<span style="color:var(--orange)">over budget</span>') + "</div></div><div>" +
        t.comps.map(([n, d, p, est]) => '<div class="comp"><span>' + n + (est ? ' <span class="tag estimate">Estimate</span>' : "") + '<br><span class="small muted">' + d + '</span></span><span class="num">' + money(p, true) + "</span></div>").join("") +
        '</div><div class="small">' + t.note + '</div><div class="small muted">' + t.miss + "</div></article>").join("") + "</div>"
    ].join("");
  };

  /* More (phone hub) */
  screens.more = () => '<h1>More</h1><section class="card list">' +
    [["travel", "plane", "Travel", "Trip planner and cost comparison"], ["inbox", "bell", "Inbox", "3 unread"], ["prefs", "gear", "Settings", "Theme, alerts, members, jobs, data"]]
      .map(([id, icn, t, s]) => '<div class="item clickable" data-go="' + id + '" role="button" tabindex="0">' + ic(icn, 22) + '<div class="grow"><div class="title">' + t + '</div><div class="small muted">' + s + "</div></div>›</div>").join("") + "</section>";

  screens.inbox = () => {
    const n = [
      ["var(--green)", "2 new Cost Rental homes match", "Riverside Quarter (3 & 4 bed houses) · Shannon Bank (4 bed duplex)", "07:15", "housing"],
      ["var(--orange)", "Electricity: comparison due", "Contract ends 3 Nov. Your renewal price is the most expensive of 5 offers.", "07:20", "money", "utilities"],
      ["var(--yellow)", "Bill ready to review", "Electric Ireland · Sep 2026", "Yesterday", "bill"],
      ["var(--cyan)", "Housing news", "Council approves 120 Cost Rental homes at Dock Road (reported, not yet confirmed)", "Yesterday", "housing"],
      ["var(--red)", "Housing check failed", "Website did not respond. Retried at 08:00 and succeeded.", "Sun", "prefs"]
    ];
    return '<h1>Inbox</h1><section class="card list">' + n.map(([c, t, s, w, target, mt]) => '<div class="item clickable" data-go="' + target + '"' + (mt ? ' data-money="' + mt + '"' : "") + ' role="button" tabindex="0"><span class="stripe" style="--c:' + c + '"></span><div class="grow"><div class="title">' + t + '</div><div class="small muted">' + s + '</div></div><span class="small muted num">' + w + "</span></div>").join("") + "</section>";
  };

  screens.prefs = () => {
    const th = state.theme;
    const jobs = [["Housing check", "Daily ~07:15", "OK today 07:14", "c-green"], ["Amenity lookup", "After housing check", "OK today 07:16", "c-green"], ["Housing news", "Daily · Claude Code routine", "OK today 06:52", "c-green"], ["Bill reader", "On upload", "Running", "c-cyan"], ["Reminders and digest", "Daily 07:20", "OK today", "c-green"], ["Backup", "Nightly 02:00", "OK · restore tested 1 Oct", "c-green"]];
    return '<h1>Settings</h1><div class="grid-2"><section class="stack">' +
      '<div class="card pad stack"><h2>Appearance</h2><div class="seg" role="group" aria-label="Theme">' + [["system", "System"], ["light", "Light"], ["dark", "Dark"]].map(([k, l]) => '<button data-theme-set="' + k + '" aria-pressed="' + (th === k) + '">' + l + "</button>").join("") + '</div><div class="small muted">Dark is Dracula. Light is Alucard, its official light variant.</div></div>' +
      '<div class="card pad stack"><h2>Alerts</h2>' + sw("Push notifications on this phone", true) + sw("Email digest at 07:30, only when something changed", true) + sw("New housing matches", true) + sw("Deadlines within 7 days", true) + sw("Housing news", false) + "</div>" +
      '<div class="card pad stack"><h2>Household</h2><div class="row between"><span>Sam · sam@example.com</span><span class="chip plain c-muted">You</span></div><div class="row between"><span>Alex · alex@example.com</span><span class="chip plain c-muted">Adult</span></div><div class="row between"><span>Rowan (8), Ivy (4)</span><span class="small muted">No login</span></div><button class="btn" data-toast="Invite sent with a sign-in code">Invite adult</button></div>' +
      '</section><section class="stack"><div class="card"><div class="pad" style="padding-bottom:6px"><h2>Background jobs</h2></div><div class="list">' +
      jobs.map(([n, s, st, c]) => '<div class="item"><div class="grow"><div class="title">' + n + '</div><div class="small muted">' + s + '</div></div><span class="chip ' + c + '">' + st + "</span></div>").join("") +
      '</div></div><div class="card pad stack"><h2>Your data</h2><div class="small muted">Export everything as CSV + JSON + original files, or delete the household.</div><div class="row"><button class="btn" data-toast="Export prepared">' + ic("download") + 'Export all</button><button class="btn" data-toast="Deletion needs both adults to confirm">Delete…</button></div></div></section></div>';
  };
  function sw(label, on) { return '<div class="row between" style="flex-wrap:nowrap"><span>' + label + '</span><button class="switch" role="switch" aria-checked="' + on + '" aria-label="' + esc(label) + '"></button></div>'; }

  /* ---------------- Render + events ---------------- */
  function render() {
    renderNav();
    document.getElementById("page").innerHTML = (screens[current] || screens.today)();
  }
  function applyTheme(t) {
    state.theme = t; store.set("theme", t);
    const r = document.documentElement;
    if (t === "system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", t);
  }

  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-go],[data-filter],[data-ltab],[data-money],[data-cat],[data-confirm],[data-confirm-all],[data-save-bill],[data-theme-set],[data-toast],.switch");
    if (!el) return;
    if (el.matches(".switch")) { el.setAttribute("aria-checked", el.getAttribute("aria-checked") !== "true"); return; }
    if (el.dataset.toast) { toast(el.dataset.toast); return; }
    if (el.dataset.themeSet) { applyTheme(el.dataset.themeSet); render(); return; }
    if (el.dataset.filter) { state.filter = el.dataset.filter; render(); return; }
    if (el.dataset.ltab) { state.ltab = el.dataset.ltab; render(); return; }
    if (el.dataset.cat) { const k = el.dataset.cat; state.cats.has(k) ? state.cats.delete(k) : state.cats.add(k); if (!state.cats.size) state.cats.add(k); render(); return; }
    if (el.dataset.confirm) { const k = el.dataset.confirm; state.confirmed.has(k) ? state.confirmed.delete(k) : state.confirmed.add(k); render(); return; }
    if (el.hasAttribute("data-confirm-all")) { ["supplier", "period", "total", "vat", "day", "night", "peak", "standing", "account"].forEach((k) => state.confirmed.add(k)); render(); return; }
    if (el.hasAttribute("data-save-bill")) { toast("Saved · linked to spending, contract and Tax 2026"); go("money", { money: "bills" }); return; }
    if (el.dataset.go) {
      const opts = {};
      if (el.dataset.listing) { opts.listing = el.dataset.listing; opts.ltab = "nearby"; }
      if (el.dataset.money) opts.money = el.dataset.money;
      go(el.dataset.go, opts); return;
    }
    if (el.dataset.money) { state.money = el.dataset.money; render(); return; }
  });
  document.addEventListener("keydown", (e) => {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"][data-go]')) { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener("change", (e) => {
    if (e.target.dataset && e.target.dataset.list) { state.lists[e.target.dataset.list] = e.target.checked; render(); }
  });
  document.getElementById("tb-inbox").addEventListener("click", () => go("inbox"));

  applyTheme(state.theme);
  const start = (location.hash || "").replace("#", "");
  current = screens[start] ? start : "today";
  render();
})();
</script>
